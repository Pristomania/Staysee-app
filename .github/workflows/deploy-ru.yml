name: Deploy StaySee to the Russian server (manual)

# Builds the site on GitHub and uploads the finished files to the new server prepared with
# deploy/ru-server/bootstrap.sh. It runs only when started by hand and does not touch the old server.
#
# Needed once in GitHub (Settings > Secrets and variables > Actions):
#   Variable: STAYSEE_SUPABASE_ANON_KEY   the public "anon" key of the Supabase project (it ends up in the browser anyway)
#   Secrets:  RU_HOST, RU_USER (deploy), RU_SSH_KEY (private key of the deploy user), RU_HOST_FINGERPRINT (from bootstrap.sh)

on:
  workflow_dispatch:
    inputs:
      https_check:
        description: "After the upload, also check https://staysee.ru through the new server (only once DNS points to it and the certificate exists)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  VITE_SUPABASE_URL: https://staysee.ru/supabase

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Production build
        env:
          VITE_SUPABASE_ANON_KEY: ${{ vars.STAYSEE_SUPABASE_ANON_KEY }}
        run: |
          test -n "$VITE_SUPABASE_ANON_KEY" || { echo "Не задана переменная STAYSEE_SUPABASE_ANON_KEY"; exit 1; }
          npm run build

      - name: Smoke-test built site
        run: npm run smoke:bundle

      - name: Upload the site and apply nginx
        env:
          RU_HOST: ${{ secrets.RU_HOST }}
          RU_USER: ${{ secrets.RU_USER }}
          RU_SSH_KEY: ${{ secrets.RU_SSH_KEY }}
          RU_HOST_FINGERPRINT: ${{ secrets.RU_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          for v in RU_HOST RU_USER RU_SSH_KEY RU_HOST_FINGERPRINT; do
            test -n "${!v}" || { echo "Не задан секрет $v"; exit 1; }
          done
          umask 077
          dir=$(mktemp -d)
          trap 'rm -rf "$dir"' EXIT
          ssh-keyscan -T 10 -t ed25519 "$RU_HOST" > "$dir/known_hosts" 2>/dev/null
          found=$(ssh-keygen -lf "$dir/known_hosts" | awk '{print $2}')
          if [ "$found" != "$RU_HOST_FINGERPRINT" ]; then
            echo "Отпечаток ключа сервера не совпал с записанным. Выкладка остановлена."
            exit 1
          fi
          printf '%s\n' "$RU_SSH_KEY" > "$dir/id"
          SSH="ssh -i $dir/id -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$dir/known_hosts"
          rsync -az --delete -e "$SSH" dist/ "$RU_USER@$RU_HOST:/var/www/Staysee-app/dist/"
          rsync -az -e "$SSH" deploy/nginx/staysee.ru.conf "$RU_USER@$RU_HOST:/home/deploy/incoming/staysee.ru.conf"
          $SSH "$RU_USER@$RU_HOST" "sudo -n /usr/local/bin/staysee-apply-nginx"

      - name: Check the site through the new server
        env:
          RU_HOST: ${{ secrets.RU_HOST }}
          HTTPS_CHECK: ${{ inputs.https_check }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 --resolve "staysee.ru:80:$RU_HOST" http://staysee.ru/)
          echo "HTTP через новый сервер: $code"
          case "$code" in 200|301) ;; *) echo "Неожиданный ответ"; exit 1 ;; esac
          if [ "$HTTPS_CHECK" = "true" ]; then
            curl --fail --silent --show-error --max-time 20 --resolve "staysee.ru:443:$RU_HOST" https://staysee.ru/ > /dev/null
            echo "HTTPS главная: ok"
            proxy=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 --resolve "staysee.ru:443:$RU_HOST" https://staysee.ru/supabase/auth/v1/health)
            echo "Прокси к Supabase: $proxy"
            case "$proxy" in 200|401) ;; *) echo "Прокси к Supabase не отвечает как нужно"; exit 1 ;; esac
          fi
