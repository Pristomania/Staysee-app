name: Deploy StaySee

env:
  VITE_SUPABASE_URL: https://staysee.ru/supabase
  VITE_SUPABASE_ANON_KEY: ci-public-build-placeholder

on:
  push:
    branches:
      - main
  # To publish the current main again by hand (after a server change): gh workflow run deploy.yml
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Offline tests
        run: npm run test:offline

      - name: Production build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Smoke-test built site
        run: npm run smoke:bundle

  verify-linux-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Smoke-test built site
        run: npm run smoke:bundle


  # The server in Russia (Beget), prepared with deploy/ru-server/bootstrap.sh: the site is built here and only the finished files are sent.
  # Needed in GitHub: variable STAYSEE_SUPABASE_ANON_KEY (the public key, it ends up in the browser anyway); secrets RU_HOST, RU_USER,
  # RU_SSH_KEY (the key of the limited user "deploy"), RU_HOST_FINGERPRINT.
  deploy:
    needs: [verify, verify-linux-build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_ANON_KEY: ${{ vars.STAYSEE_SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: |
          test -n "$VITE_SUPABASE_ANON_KEY" || { echo "STAYSEE_SUPABASE_ANON_KEY is not set"; exit 1; }
          npm run build

      - name: Smoke-test built site
        run: npm run smoke:bundle

      - name: Upload the site and apply nginx
        env:
          RU_HOST: ${{ secrets.RU_HOST }}
          RU_USER: ${{ secrets.RU_USER }}
          RU_SSH_KEY: ${{ secrets.RU_SSH_KEY }}
          RU_HOST_FINGERPRINT: ${{ secrets.RU_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          for v in RU_HOST RU_USER RU_SSH_KEY RU_HOST_FINGERPRINT; do
            test -n "${!v}" || { echo "Secret $v is not set"; exit 1; }
          done
          umask 077
          dir=$(mktemp -d)
          trap 'rm -rf "$dir"' EXIT
          ssh-keyscan -T 10 -t ed25519 "$RU_HOST" > "$dir/known_hosts" 2>/dev/null
          found=$(ssh-keygen -lf "$dir/known_hosts" | awk '{print $2}')
          if [ "$found" != "$RU_HOST_FINGERPRINT" ]; then
            echo "The server's key does not match the recorded one. Nothing was sent."
            exit 1
          fi
          printf '%s\n' "$RU_SSH_KEY" > "$dir/id"
          SSH="ssh -i $dir/id -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$dir/known_hosts"
          rsync -az --delete -e "$SSH" dist/ "$RU_USER@$RU_HOST:/var/www/Staysee-app/dist/"
          rsync -az -e "$SSH" deploy/nginx/staysee.ru.conf "$RU_USER@$RU_HOST:/home/deploy/incoming/staysee.ru.conf"
          $SSH "$RU_USER@$RU_HOST" "sudo -n /usr/local/bin/staysee-apply-nginx"

      - name: Verify production site
        env:
          RU_HOST: ${{ secrets.RU_HOST }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --max-time 20 --resolve "staysee.ru:443:$RU_HOST" https://staysee.ru/ > /dev/null
          proxy=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 --resolve "staysee.ru:443:$RU_HOST" https://staysee.ru/supabase/auth/v1/health)
          echo "Way to the database: HTTP $proxy"
          case "$proxy" in 200|401) ;; *) echo "The way to the database does not answer as it should"; exit 1 ;; esac
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --max-time 20 https://staysee.ru/ > /dev/null
