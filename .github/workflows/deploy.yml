name: Deploy StaySee

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Offline tests
        run: npm run test:offline

      - name: Production build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Smoke-test built site
        run: npm run smoke:bundle

  deploy:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize nginx script line endings
        run: |
          sed -i 's/\r$//' deploy/nginx/*.sh deploy/nginx/*.conf
          chmod +x deploy/nginx/*.sh

      - name: Copy nginx scripts to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAYSEE_HOST }}
          username: ${{ secrets.STAYSEE_USER }}
          key: ${{ secrets.STAYSEE_SSH_KEY }}
          port: ${{ secrets.STAYSEE_PORT }}
          source: "deploy/nginx/staysee.ru.conf,deploy/nginx/apply-on-vps.sh,deploy/nginx/resolve-web-root.sh,deploy/nginx/reload-or-start-nginx.sh"
          target: "/tmp/staysee-nginx/"

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAYSEE_HOST }}
          username: ${{ secrets.STAYSEE_USER }}
          key: ${{ secrets.STAYSEE_SSH_KEY }}
          port: ${{ secrets.STAYSEE_PORT }}
          script: |
            set -euo pipefail
            # Build frontend / sync dist. A failure here (build error, bad
            # bundle, sync failure) must stop the deploy -- it used to be
            # swallowed with only a warning so a broken build could still
            # report success. Nginx being briefly inactive is not a reason
            # to tolerate this: reload-or-start-nginx.sh below already
            # starts nginx on its own if it isn't running, and fails loudly
            # if that doesn't work either.
            deploy-staysee
            NGINX_SCRIPTS=/tmp/staysee-nginx/deploy/nginx
            chmod +x "$NGINX_SCRIPTS"/*.sh
            sed -i 's/\r$//' "$NGINX_SCRIPTS"/*.sh "$NGINX_SCRIPTS"/*.conf
            STAYSEE_NGINX_SRC="$NGINX_SCRIPTS/staysee.ru.conf"
            test -f "$STAYSEE_NGINX_SRC"
            test -f "$NGINX_SCRIPTS/reload-or-start-nginx.sh"
            export STAYSEE_NGINX_SRC
            bash "$NGINX_SCRIPTS/apply-on-vps.sh"
            bash "$NGINX_SCRIPTS/reload-or-start-nginx.sh"

      - name: Verify production site
        run: curl --fail --silent --show-error --retry 5 --retry-delay 3 --max-time 20 https://staysee.ru/ > /dev/null
