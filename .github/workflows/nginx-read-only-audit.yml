name: Nginx read-only audit

on:
  workflow_dispatch:

permissions: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Pinned OpenSSH read-only diagnostics
        shell: bash
        env:
          VPS_USER: ${{ secrets.STAYSEE_USER }}
          VPS_PORT: ${{ secrets.STAYSEE_PORT }}
          VPS_KEY: ${{ secrets.STAYSEE_SSH_KEY }}
        run: |
          set -euo pipefail
          host=78.17.147.119
          expected='SHA256:1dFf5aMBiBD7c0Ss/WA9Njn/Qw67GY+JpAaem0nCOSQ'
          umask 077
          temp=$(mktemp -d)
          trap 'rm -f -- "$temp/identity" "$temp/known_hosts"; rmdir -- "$temp"' EXIT
          ssh-keyscan -T 8 -p "$VPS_PORT" -t ed25519 "$host" > "$temp/known_hosts" 2>/dev/null
          found=$(ssh-keygen -lf "$temp/known_hosts" | awk '{print $2}' | sort -u)
          if [ "$found" != "$expected" ]; then echo 'SSH host verification failed'; exit 1; fi
          echo 'Pinned ED25519 verified'
          printf '%s\n' "$VPS_KEY" > "$temp/identity"
          unset VPS_KEY
          ssh -F /dev/null -p "$VPS_PORT" -i "$temp/identity" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$temp/known_hosts" -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 -o ConnectTimeout=8 -o ClearAllForwardings=yes -l "$VPS_USER" "$host" 'bash -s' <<'REMOTE'
          set -o pipefail
          export LC_ALL=C
          sudo -n true || exit 1
          echo "capture_start_utc=$(date -u +%FT%TZ)"
          sudo -n timeout --signal=INT 100 tcpdump -l -tt -ni ens3 -Q in -s 96 -c 1000 '(udp dst port 39238 or udp dst port 39484 or tcp dst port 443)' 2>&1 |
            awk '/^[0-9]+[.][0-9]+ / {
              port=($0 ~ /[.]39238:/ ? "39238/udp" : ($0 ~ /[.]39484:/ ? "39484/udp" : "443/tcp"));
              sub(/[.].*/, "", $1); key=$1 " " port; hits[key]++; total++;
              next
            }
            /listening on|packets captured|packets received by filter|packets dropped by kernel/ {print; next}
            /command not found|No such device|Permission denied/ {print}
            END {for (key in hits) print "counts_by_epoch_second",key,hits[key]; print "total_packets",total+0}'
          status=${PIPESTATUS[0]}
          echo "capture_end_utc=$(date -u +%FT%TZ)"
          echo "capture_exit=$status"
          [ "$status" -eq 0 ] || [ "$status" -eq 124 ]
          REMOTE
