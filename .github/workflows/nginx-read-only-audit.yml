name: Nginx read-only audit

on:
  workflow_dispatch:

permissions: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Pinned OpenSSH read-only diagnostics
        shell: bash
        env:
          VPS_USER: ${{ secrets.STAYSEE_USER }}
          VPS_PORT: ${{ secrets.STAYSEE_PORT }}
          VPS_KEY: ${{ secrets.STAYSEE_SSH_KEY }}
        run: |
          set -euo pipefail
          host=78.17.147.119
          expected='SHA256:1dFf5aMBiBD7c0Ss/WA9Njn/Qw67GY+JpAaem0nCOSQ'
          umask 077
          temp=$(mktemp -d)
          trap 'rm -f -- "$temp/identity" "$temp/known_hosts"; rmdir -- "$temp"' EXIT
          ssh-keyscan -T 8 -p "$VPS_PORT" -t ed25519 "$host" > "$temp/known_hosts" 2>/dev/null
          found=$(ssh-keygen -lf "$temp/known_hosts" | awk '{print $2}' | sort -u)
          if [ "$found" != "$expected" ]; then echo 'SSH host verification failed'; exit 1; fi
          echo 'Pinned ED25519 verified'
          printf '%s\n' "$VPS_KEY" > "$temp/identity"
          unset VPS_KEY
          ssh -F /dev/null -p "$VPS_PORT" -i "$temp/identity" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$temp/known_hosts" -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 -o ConnectTimeout=8 -o ClearAllForwardings=yes -l "$VPS_USER" "$host" 'bash -s' <<'REMOTE'
          export LC_ALL=C
          echo '--- listeners ---'
          ss -H -ltn '( sport = :443 )'
          ss -H -lun '( sport = :39238 or sport = :39484 )'
          printf 'nginx_status='; systemctl is-active nginx
          if sudo -n nginx -t >/dev/null 2>&1; then echo nginx_config=ok; else echo nginx_config=failed_or_unavailable; fi
          curl --noproxy '*' -sS --max-time 6 --resolve staysee.ru:443:127.0.0.1 -o /dev/null -w 'local HTTPS=%{http_code}\n' https://staysee.ru/ || true
          curl --noproxy '*' -sS --max-time 6 --resolve staysee.ru:443:127.0.0.1 -o /dev/null -w 'local Supabase proxy=%{http_code}\n' https://staysee.ru/supabase/auth/v1/health || true
          echo '--- firewall ---'
          if sudo -n ufw status verbose >/dev/null 2>&1; then
            sudo -n ufw status verbose | awk '/^Status:|^Default:/{print} /^[[:space:]]*(443|39238|39484)([/ ,]|$)|^Nginx/{print "matching UFW rule:", $1, $2, $3}'
          else echo ufw=unavailable; fi
          for chain in INPUT FORWARD DOCKER-USER; do
            if sudo -n iptables -S "$chain" >/dev/null 2>&1; then
              sudo -n iptables -S "$chain" | awk '/^-P /{print} /--dport (443|39238|39484)( |$)/{for(i=1;i<NF;i++) if($i=="-j") print "port rule:",$2,$(i+1)}'
            fi
          done
          if sudo -n nft list ruleset >/dev/null 2>&1; then
            sudo -n nft list ruleset | awk '/hook (input|forward)/ {for(i=1;i<NF;i++) if ($i=="policy") print "nft hook:",$(i-3),$(i+1)}'
          fi
          echo '--- VPN ---'
          if sudo -n docker ps --format '{{.Names}} {{.Status}} {{.Ports}}' >/dev/null 2>&1; then
            sudo -n docker ps --format '{{.Names}} {{.Status}} {{.Ports}}' | awk '$1=="amnezia-awg" || $1=="amnezia-awg2"'
            for c in amnezia-awg amnezia-awg2; do
              if h=$(sudo -n docker exec "$c" awg show all latest-handshakes 2>/dev/null); then
                printf '%s\n' "$h" | awk -v label="$c" 'NF>=2 {peers++; if ($NF+0>0) {seen++; if ($NF+0>last) last=$NF+0}} END{printf "%s peers=%d with_handshake=%d latest_epoch=%d\n",label,peers,seen,last}'
              else echo "$c handshake_status=unavailable"; fi
            done
          else echo docker=unavailable; fi
          echo '--- nginx errors: counts only ---'
          if sudo -n test -r /var/log/nginx/error.log; then
            sudo -n tail -n 200 /var/log/nginx/error.log | awk '/\[error\]|\[crit\]|\[alert\]|\[emerg\]/ {total++; if(/upstream timed out|connect\(\) failed.*upstream|could not be resolved/) upstream++} END {printf "nginx error lines in last 200=%d upstream subset=%d\n",total,upstream}'
          else echo nginx_error_log=unavailable; fi
          echo VPS_READ_ONLY_DONE
          REMOTE
