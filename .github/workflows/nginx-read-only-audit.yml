name: Nginx read-only audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read-only voice capacity audit on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAYSEE_HOST }}
          username: ${{ secrets.STAYSEE_USER }}
          key: ${{ secrets.STAYSEE_SSH_KEY }}
          port: ${{ secrets.STAYSEE_PORT }}
          command_timeout: 2m
          script: |
            set -eu
            printf '\nCPU\n'
            lscpu | grep -E 'Architecture|CPU\(s\)|Model name|Thread|Core|Socket|Hypervisor' || true
            printf '\nMEMORY_MIB\n'
            free -m
            printf '\nROOT_DISK\n'
            df -h /
            printf '\nLOAD\n'
            uptime
            printf '\nCPU_MEMORY_SAMPLE\n'
            vmstat 1 5
            printf '\nTOP_PROCESSES_NO_ARGUMENTS\n'
            ps -eo comm,pcpu,pmem,rss --sort=-rss | head -n 12
            printf '\nRUNTIMES\n'
            python3 --version || true
            docker --version || true
            command -v ffmpeg || true
            command -v nvidia-smi || true
            printf '\nNGINX_STATUS\n'
            systemctl is-active nginx || true
