name: Nginx read-only audit

on:
  workflow_dispatch:

permissions: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Pinned OpenSSH read-only diagnostics
        shell: bash
        env:
          VPS_USER: ${{ secrets.STAYSEE_USER }}
          VPS_PORT: ${{ secrets.STAYSEE_PORT }}
          VPS_KEY: ${{ secrets.STAYSEE_SSH_KEY }}
        run: |
          set -euo pipefail
          host=78.17.147.119
          expected='SHA256:1dFf5aMBiBD7c0Ss/WA9Njn/Qw67GY+JpAaem0nCOSQ'
          umask 077
          temp=$(mktemp -d)
          trap 'rm -f -- "$temp/identity" "$temp/known_hosts"; rmdir -- "$temp"' EXIT
          ssh-keyscan -T 8 -p "$VPS_PORT" -t ed25519 "$host" > "$temp/known_hosts" 2>/dev/null
          found=$(ssh-keygen -lf "$temp/known_hosts" | awk '{print $2}' | sort -u)
          if [ "$found" != "$expected" ]; then echo 'SSH host verification failed'; exit 1; fi
          echo 'Pinned ED25519 verified'
          printf '%s\n' "$VPS_KEY" > "$temp/identity"
          unset VPS_KEY
          ssh -F /dev/null -p "$VPS_PORT" -i "$temp/identity" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$temp/known_hosts" -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 -o ConnectTimeout=8 -o ClearAllForwardings=yes -l "$VPS_USER" "$host" 'bash -s' <<'REMOTE'
          set -euo pipefail
          domain=staysee.online
          conf=/etc/nginx/conf.d/staysee-online-probe.conf
          if ! sudo -n true; then echo "SUDO_UNAVAILABLE"; exit 1; fi
          if sudo -n test -d /var/www/certbot; then echo "ACME_WEBROOT_EXISTS"; else echo "ACME_WEBROOT_ABSENT"; fi
          if command -v certbot >/dev/null || sudo -n sh -c 'command -v certbot' >/dev/null; then echo "CERTBOT_PRESENT"; else echo "CERTBOT_ABSENT"; fi
          if sudo -n test -e "$conf"; then echo "probe config exists; refusing overwrite"; exit 1; fi
          if sudo -n nginx -T 2>/dev/null | grep -E '^[[:space:]]*server_name[[:space:]].*staysee[.]online([[:space:];]|$)' >/dev/null; then echo "online vhost already exists"; exit 1; fi
          if ! sudo -n nginx -t >/dev/null 2>&1; then echo "baseline nginx -t failed"; exit 1; fi
          tmp=$(mktemp)
          trap 'rm -f -- "$tmp"' EXIT
          cat > "$tmp" <<'CONF'
          server {
            listen 80;
            listen [::]:80;
            server_name staysee.online;
            location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
            location = /healthz { default_type text/plain; return 200 "Reachability OK"; }
            location / { return 404; }
          }
          CONF
          apply() {
            sudo -n install -m 0644 "$tmp" "$conf"
            if ! sudo -n nginx -t || ! sudo -n systemctl reload nginx; then
              sudo -n unlink "$conf"
              sudo -n nginx -t && sudo -n systemctl reload nginx
              return 1
            fi
          }
          apply
          curl --noproxy '*' -fsS --max-time 5 --resolve "$domain:80:127.0.0.1" "http://$domain/healthz"
          echo
          if ! sudo -n sh -c 'command -v certbot' >/dev/null; then echo "CERTBOT_ABSENT; stopped before issuance"; exit 0; fi
          if ! sudo -n test -d /var/www/certbot; then echo "ACME_WEBROOT_ABSENT; stopped before issuance"; exit 0; fi
          for dns in ns1.reg.ru ns2.reg.ru; do
            if [ "$(dig +short +time=3 +tries=1 @"$dns" "$domain" A)" != "78.17.147.119" ]; then
              echo "DNS_PENDING on $dns; no certificate request made"
              exit 0
            fi
          done
          if ! sudo -n certbot certonly --webroot -w /var/www/certbot --cert-name "$domain" -d "$domain" --non-interactive --keep-until-expiring; then
            echo "CERTIFICATE_NOT_ISSUED; HTTP probe remains, old vhost unchanged"
            exit 1
          fi
          cat >> "$tmp" <<'CONF'
          server {
            listen 443 ssl;
            listen [::]:443 ssl;
            server_name staysee.online;
            ssl_certificate /etc/letsencrypt/live/staysee.online/fullchain.pem;
            ssl_certificate_key /etc/letsencrypt/live/staysee.online/privkey.pem;
            location = /healthz { default_type text/plain; return 200 "Reachability OK"; }
            location / { return 404; }
          }
          CONF
          apply
          curl --noproxy '*' -fsS --max-time 5 --resolve "$domain:443:127.0.0.1" "https://$domain/healthz"
          echo
          REMOTE
