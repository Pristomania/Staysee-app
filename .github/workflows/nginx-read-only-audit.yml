name: Nginx read-only audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Public web probe from runner
        shell: bash
        run: |
          curl -4 --noproxy '*' -sS --max-time 8 --resolve staysee.ru:80:78.17.147.119 -o /dev/null -w 'external HTTP status=%{http_code} connect=%{time_connect}\n' http://staysee.ru/ || true
          curl -4 --noproxy '*' -sS --max-time 8 --resolve staysee.ru:443:78.17.147.119 -o /dev/null -w 'external HTTPS status=%{http_code} connect=%{time_connect} tls=%{time_appconnect}\n' https://staysee.ru/ || true
      - name: Read-only web and filtering probes on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAYSEE_HOST }}
          username: ${{ secrets.STAYSEE_USER }}
          key: ${{ secrets.STAYSEE_SSH_KEY }}
          port: ${{ secrets.STAYSEE_PORT }}
          fingerprint: SHA256:1dFf5aMBiBD7c0Ss/WA9Njn/Qw67GY+JpAaem0nCOSQ
          command_timeout: 1m
          script: |
            echo '--- nginx ---'
            systemctl is-active nginx || true
            if sudo -n nginx -t >/dev/null 2>&1; then echo nginx_config=ok; else echo nginx_config=failed_or_unavailable; fi
            ss -ltnH '( sport = :80 or sport = :443 )' | awk '{print "listener", $4}'
            curl -4 --noproxy '*' -sS --max-time 5 --resolve staysee.ru:80:127.0.0.1 -o /dev/null -w 'loopback HTTP status=%{http_code}\n' http://staysee.ru/ || true
            curl -4 --noproxy '*' -sS --max-time 5 --resolve staysee.ru:443:127.0.0.1 -o /dev/null -w 'loopback HTTPS status=%{http_code} tls=%{time_appconnect}\n' https://staysee.ru/ || true
            curl -4 --noproxy '*' -sS --max-time 5 --resolve staysee.ru:443:127.0.0.1 -o /dev/null -w 'loopback auth proxy HTTP=%{http_code}\n' https://staysee.ru/supabase/auth/v1/health || true
            curl -4 --noproxy '*' -sS --max-time 6 --resolve staysee.ru:443:78.17.147.119 -o /dev/null -w 'VPS public-address HTTPS status=%{http_code} connect=%{time_connect}\n' https://staysee.ru/ || true
            echo '--- firewall summaries ---'
            if sudo -n ufw status verbose >/dev/null 2>&1; then
              sudo -n ufw status verbose | awk '/^Status:|^Default:/{print} /^[[:space:]]*(80|443)([/ ,]|$)|^Nginx/{print "web_ufw_rule", $1, $2, $3}'
            else echo ufw_status=unavailable; fi
            if sudo -n iptables -S INPUT >/dev/null 2>&1; then
              sudo -n iptables -S INPUT | awk '/^-P INPUT/{print "IPv4", $0} /--dport (80|443)( |$)|--dports (80|443)(,| |$)/{for (i=1;i<NF;i++) if ($i=="-j") print "web_input_rule", $(i+1)}'
            else echo iptables_status=unavailable; fi
            if sudo -n nft list ruleset >/dev/null 2>&1; then
              sudo -n nft list ruleset | awk '/hook input/{for (i=1;i<NF;i++) if ($i=="policy") print "nft input policy", $(i+1)}'
            else echo nft_status=unavailable; fi
            echo WEB_AUDIT_DONE
