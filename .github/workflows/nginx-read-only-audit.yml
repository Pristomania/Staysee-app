name: Nginx read-only audit

on:
  workflow_dispatch:
    inputs:
      novosibirsk_probe:
        description: 'No-credentials reachability check for the Novosibirsk VPS'
        type: boolean
        default: false
      preview_password_hash:
        description: 'Temporary preview password verifier (not the password)'
        required: false
        type: string
      awg_delivery_public:
        description: 'One-time RSA public key for encrypted delivery of an authorized AWG profile'
        required: false
        type: string

permissions: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        if: ${{ inputs.preview_password_hash != '' || inputs.awg_delivery_public != '' }}
        with:
          persist-credentials: false
      - name: Pinned OpenSSH probe or isolated preview
        if: ${{ !inputs.novosibirsk_probe }}
        shell: bash
        env:
          VPS_USER: ${{ secrets.STAYSEE_USER }}
          VPS_PORT: ${{ secrets.STAYSEE_PORT }}
          VPS_KEY: ${{ secrets.STAYSEE_SSH_KEY }}
          PREVIEW_PASSWORD_HASH: ${{ inputs.preview_password_hash }}
          AWG_DELIVERY_PUBLIC: ${{ inputs.awg_delivery_public }}
        run: |
          set -euo pipefail
          host=78.17.147.119
          expected='SHA256:1dFf5aMBiBD7c0Ss/WA9Njn/Qw67GY+JpAaem0nCOSQ'
          umask 077
          temp=$(mktemp -d)
          trap 'rm -f -- "$temp/identity" "$temp/known_hosts"; rmdir -- "$temp"' EXIT
          ssh-keyscan -T 8 -p "$VPS_PORT" -t ed25519 "$host" > "$temp/known_hosts" 2>/dev/null
          found=$(ssh-keygen -lf "$temp/known_hosts" | awk '{print $2}' | sort -u)
          if [ "$found" != "$expected" ]; then echo 'SSH host verification failed'; exit 1; fi
          echo 'Pinned ED25519 verified'
          printf '%s\n' "$VPS_KEY" > "$temp/identity"
          unset VPS_KEY
          if [[ -n "$AWG_DELIVERY_PUBLIC" ]]; then
            [[ -z "$PREVIEW_PASSWORD_HASH" && "$AWG_DELIVERY_PUBLIC" =~ ^[A-Za-z0-9+/]{550,570}={0,2}$ ]]
            ssh -F /dev/null -p "$VPS_PORT" -i "$temp/identity" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$temp/known_hosts" -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 -o ConnectTimeout=8 -o ClearAllForwardings=yes -l "$VPS_USER" "$host" "sudo -n bash -s -- '$AWG_DELIVERY_PUBLIC'" < deploy/nginx/one-time-awg-profile.sh
            exit
          fi
          if [[ -n "$PREVIEW_PASSWORD_HASH" ]]; then
            [[ "$PREVIEW_PASSWORD_HASH" =~ ^\{SHA\}[A-Za-z0-9+/]{27}=$ ]]
            ssh -F /dev/null -p "$VPS_PORT" -i "$temp/identity" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$temp/known_hosts" -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 -o ConnectTimeout=8 -o ClearAllForwardings=yes -l "$VPS_USER" "$host" "sudo -n bash -s -- '$PREVIEW_PASSWORD_HASH'" < deploy/nginx/online-preview-spike.sh
            exit
          fi
          ssh -F /dev/null -p "$VPS_PORT" -i "$temp/identity" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$temp/known_hosts" -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 -o ConnectTimeout=8 -o ClearAllForwardings=yes -l "$VPS_USER" "$host" 'bash -s' <<'REMOTE'
          set -euo pipefail
          domain=staysee.online
          conf=/etc/nginx/conf.d/staysee-online-probe.conf
          if ! sudo -n true; then echo "SUDO_UNAVAILABLE"; exit 1; fi
          if sudo -n test -d /var/www/certbot; then echo "ACME_WEBROOT_EXISTS"; else echo "ACME_WEBROOT_ABSENT"; fi
          if command -v certbot >/dev/null || sudo -n sh -c 'command -v certbot' >/dev/null; then echo "CERTBOT_PRESENT"; else echo "CERTBOT_ABSENT"; fi
          if ! sudo -n nginx -t >/dev/null 2>&1; then echo "baseline nginx -t failed"; exit 1; fi
          tmp=$(mktemp)
          trap 'rm -f -- "$tmp"' EXIT
          cat > "$tmp" <<'CONF'
          server {
            listen 80;
            listen [::]:80;
            server_name staysee.online;
            location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
            location = /healthz { default_type text/plain; return 200 "Reachability OK"; }
            location / { return 404; }
          }
          CONF
          apply() {
            sudo -n install -m 0644 "$tmp" "$conf"
            if ! sudo -n nginx -t || ! sudo -n systemctl reload nginx; then
              sudo -n unlink "$conf"
              sudo -n nginx -t && sudo -n systemctl reload nginx
              return 1
            fi
          }
          if sudo -n test -e "$conf"; then
            if ! sudo -n cmp -s "$tmp" "$conf"; then echo "UNEXPECTED_EXISTING_CONFIG"; exit 1; fi
            echo "Existing HTTP probe verified"
          else
            if sudo -n nginx -T 2>/dev/null | grep -E '^[[:space:]]*server_name[[:space:]].*staysee[.]online([[:space:];]|$)' >/dev/null; then echo "online vhost already exists"; exit 1; fi
            apply
          fi
          test "$(curl --noproxy '*' -fsS --retry 2 --retry-delay 1 --max-time 5 --resolve "$domain:80:127.0.0.1" "http://$domain/healthz")" = "Reachability OK"
          echo "HTTP_PROBE_VERIFIED"
          if ! sudo -n sh -c 'command -v certbot' >/dev/null; then echo "CERTBOT_ABSENT; stopped before issuance"; exit 0; fi
          for dns in ns1.reg.ru ns2.reg.ru; do
            ans=$(dig +short +norecurse +time=3 +tries=1 @"$dns" "$domain" A)
            echo "authoritative $dns A=$ans"
            if [ "$ans" != "78.17.147.119" ]; then
              echo "DNS_PENDING on $dns; no certificate request made"
              exit 0
            fi
          done
          if ! sudo -n test -d /var/www/certbot; then
            sudo -n install -d -m 0755 /var/www/certbot
          fi
          if ! sudo -n certbot certonly --webroot -w /var/www/certbot --cert-name "$domain" -d "$domain" --non-interactive --keep-until-expiring; then
            echo "CERTIFICATE_NOT_ISSUED; HTTP probe remains, old vhost unchanged"
            exit 1
          fi
          cat >> "$tmp" <<'CONF'
          server {
            listen 443 ssl;
            listen [::]:443 ssl;
            server_name staysee.online;
            ssl_certificate /etc/letsencrypt/live/staysee.online/fullchain.pem;
            ssl_certificate_key /etc/letsencrypt/live/staysee.online/privkey.pem;
            location = /healthz { default_type text/plain; return 200 "Reachability OK"; }
            location / { return 404; }
          }
          CONF
          apply
          curl --noproxy '*' -fsS --max-time 5 --resolve "$domain:443:127.0.0.1" "https://$domain/healthz"
          echo
          REMOTE
      - name: Read-only Novosibirsk port and SSH identity check
        if: ${{ inputs.novosibirsk_probe }}
        shell: bash
        run: |
          set -u
          host=37.139.51.107
          for scheme in http https; do
            curl --noproxy '*' --insecure --silent --show-error --connect-timeout 5 --max-time 8 --output /dev/null --write-out "$scheme HTTP=%{http_code} peer=%{remote_ip}\n" "$scheme://$host/" || true
          done
          keys=$(ssh-keyscan -T 8 -t ed25519 "$host" 2>&1)
          if grep -q ' ssh-ed25519 ' <<< "$keys"; then
            grep ' ssh-ed25519 ' <<< "$keys" | ssh-keygen -lf -
          else
            printf 'SSH has not supplied an ED25519 key:\n%s\n' "$keys"
            exit 1
          fi
