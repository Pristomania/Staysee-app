name: Server temporary keys (self-hosted database setup)

# BRANCH ONLY (do not merge). Puts the temporary keys (SELFHOST_* secrets, 30 days) into a file readable by root only,
# for the test copy of the database on the current server. Values are never printed.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write the keys for the test copy
        uses: appleboy/ssh-action@v1.0.3
        env:
          OPENROUTER_API_KEY: ${{ secrets.SELFHOST_OPENROUTER_API_KEY }}
          CLOUDRU_API_KEY: ${{ secrets.SELFHOST_CLOUDRU_API_KEY }}
          POSTBOX_SMTP_USER: ${{ secrets.SELFHOST_POSTBOX_SMTP_USER }}
          POSTBOX_SMTP_PASSWORD: ${{ secrets.SELFHOST_POSTBOX_SMTP_PASSWORD }}
        with:
          host: ${{ secrets.STAYSEE_HOST }}
          username: ${{ secrets.STAYSEE_USER }}
          key: ${{ secrets.STAYSEE_SSH_KEY }}
          port: ${{ secrets.STAYSEE_PORT }}
          envs: OPENROUTER_API_KEY,CLOUDRU_API_KEY,POSTBOX_SMTP_USER,POSTBOX_SMTP_PASSWORD
          script: |
            set -eu
            umask 077
            cd /opt/staysee-selfhost/deploy/supabase-selfhost
            : > functions.secrets.env
            for name in OPENROUTER_API_KEY CLOUDRU_API_KEY POSTBOX_SMTP_USER POSTBOX_SMTP_PASSWORD; do
              eval "value=\${$name:-}"
              value=$(printf '%s' "$value" | tr -d '\r\n')
              [ -n "$value" ] || { echo "empty: $name"; exit 1; }
              case "$value" in *\'*) echo "unexpected quote in $name"; exit 1 ;; esac
              printf "%s='%s'\n" "$name" "$value" >> functions.secrets.env
              echo "written: $name"
            done
            cat functions.switches.env functions.hook.env functions.secrets.env > functions.env
            chmod 600 functions.env functions.secrets.env
            echo "lines in functions.env: $(wc -l < functions.env)"
            echo KEYS_DONE
