name: Server temporary access (self-hosted database setup)

# BRANCH ONLY (do not merge). Approved by the owner on 26.11.2026: a temporary key for setting up the test copy of the database
# on the current server, so that conversations go from the owner's computer to the server directly and never through GitHub.
# Remove it afterwards: sed -i '/staysee-selfhost-tmp-20261126/d' /root/.ssh/authorized_keys

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Add the temporary key and show the public identity of the server
        uses: appleboy/ssh-action@v1.0.3
        env:
          PUBKEY: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOltX3iQWQDBPa9fSZRlvfYnCbavXUZR/VaiLSVjRCn1 staysee-selfhost-tmp-20261126"
        with:
          host: ${{ secrets.STAYSEE_HOST }}
          username: ${{ secrets.STAYSEE_USER }}
          key: ${{ secrets.STAYSEE_SSH_KEY }}
          port: ${{ secrets.STAYSEE_PORT }}
          envs: PUBKEY
          script: |
            set -eu
            install -d -m 700 "$HOME/.ssh"
            touch "$HOME/.ssh/authorized_keys"
            chmod 600 "$HOME/.ssh/authorized_keys"
            [ -z "$(tail -c1 "$HOME/.ssh/authorized_keys")" ] || echo >> "$HOME/.ssh/authorized_keys"
            if grep -qF 'staysee-selfhost-tmp-20261126' "$HOME/.ssh/authorized_keys"; then
              echo "temporary key: already there"
            else
              printf '%s\n' "$PUBKEY" >> "$HOME/.ssh/authorized_keys"
              echo "temporary key: added"
            fi
            echo "keys in the file: $(grep -cE '^(ssh|ecdsa)' "$HOME/.ssh/authorized_keys")"
            echo "===== public host keys of the server ====="
            cat /etc/ssh/ssh_host_*_key.pub
            echo ACCESS_DONE
