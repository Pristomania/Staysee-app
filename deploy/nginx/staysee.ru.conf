# StaySee — production Nginx for staysee.ru
# Apply: bash deploy/nginx/apply-on-vps.sh
# root is resolved at apply time (@@STAYSEE_WEB_ROOT@@) — see resolve-web-root.sh
#
# /supabase/ uses runtime DNS (resolver + variable proxy_pass) so a temporary
# failure to resolve jnxrildlwvtxhtiwucbt.supabase.co does not block nginx -t
# or nginx startup. Static SPA remains available; only the proxy location may 502.

server {
    listen 80;
    listen [::]:80;
    server_name staysee.ru www.staysee.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name staysee.ru www.staysee.ru;

    ssl_certificate     /etc/letsencrypt/live/staysee.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staysee.ru/privkey.pem;

    # TLS session reuse — cuts repeat handshake latency (iOS opens many connections).
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Static compression (no brotli in stock nginx). Safe for SPA assets.
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Runtime DNS for variable proxy_pass (from VPS /etc/resolv.conf stub).
    resolver 127.0.0.53 valid=30s;
    resolver_timeout 5s;

    root @@STAYSEE_WEB_ROOT@@;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # URI semantics (must match prior literal proxy_pass ...supabase.co/; ):
    #   /supabase/rest/v1/x?a=1  →  https://jnxrildlwvtxhtiwucbt.supabase.co/rest/v1/x?a=1
    # rewrite + proxy_pass $origin (no URI path) preserves query string.
    location /supabase/ {
        set $supabase_origin https://jnxrildlwvtxhtiwucbt.supabase.co;
        rewrite ^/supabase/(.*)$ /$1 break;
        proxy_pass $supabase_origin;
        proxy_ssl_server_name on;
        proxy_ssl_name jnxrildlwvtxhtiwucbt.supabase.co;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;

        proxy_set_header Host jnxrildlwvtxhtiwucbt.supabase.co;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;

        client_max_body_size 4m;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
