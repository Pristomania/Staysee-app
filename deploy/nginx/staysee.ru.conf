# StaySee — production Nginx for staysee.ru
# Apply: bash deploy/nginx/apply-on-vps.sh
# root is resolved at apply time (@@STAYSEE_WEB_ROOT@@) — see resolve-web-root.sh
#
# /supabase/ goes to the database stack on this server.

server {
    listen 80;
    listen [::]:80;
    server_name staysee.ru www.staysee.ru staysee.online app.stayseeai.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name staysee.ru www.staysee.ru staysee.online app.stayseeai.online;

    ssl_certificate     /etc/letsencrypt/live/staysee.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staysee.ru/privkey.pem;

    # TLS session reuse — cuts repeat handshake latency (iOS opens many connections).
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Static compression (no brotli in stock nginx). Safe for SPA assets.
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    root @@STAYSEE_WEB_ROOT@@;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The page itself names the build files of the current version, and every deploy replaces them with new ones.
    # It is never kept without asking the server first (a 304 is a few bytes), otherwise a browser may show a page
    # whose files are already gone. `add_header` in a location replaces the server-level ones, so they are repeated.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # On-device voice dictation model/engine files. Served from a fixed
    # path outside the git-managed app root (/var/www/staysee-voice-model/)
    # so they survive every normal `git pull` + rebuild deploy untouched --
    # they are not part of this repo and are uploaded separately, once per
    # model revision. The revision segment in the URL (83bbf6f-large-int8)
    # means a future model update is a new, separate path: old cached
    # copies in users' browsers keep working during rollout, and immutable
    # caching here is honest because a given revision's files never change.
    location /voice-model/ {
        alias /var/www/staysee-voice-model/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # The database, the sign-in and the server functions run on this server (deploy/supabase-selfhost, listening on
    # 127.0.0.1:8100 only), moved here from the cloud project on 28.11.2026:
    #   /supabase/rest/v1/x?a=1  →  http://127.0.0.1:8100/rest/v1/x?a=1
    location /supabase/ {
        rewrite ^/supabase/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8100;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 150s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 150s;

        client_max_body_size 4m;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
