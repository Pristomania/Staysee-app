# StaySee: the trimmed gateway config of the self-hosted Supabase (rehearsal and the future server).
# Cut from the official docker/volumes/api/kong.yml (supabase/supabase, 2026-11-19): only Auth, PostgREST and Edge Functions stay.
# Removed on purpose: Studio dashboard, Realtime, Storage, GraphQL, postgres-meta, MCP (the app uses none of them).
_format_version: '2.1'
_transform: true

###
### Consumers / Users
###
consumers:
  - username: anon
    keyauth_credentials:
      - key: $SUPABASE_ANON_KEY
      - key: $SUPABASE_PUBLISHABLE_KEY
  - username: service_role
    keyauth_credentials:
      - key: $SUPABASE_SERVICE_KEY
      - key: $SUPABASE_SECRET_KEY

###
### Access Control List
###
acls:
  - consumer: anon
    group: anon
  - consumer: service_role
    group: admin


###
### API Routes
###
services:
  ## Open Auth routes
  - name: auth-v1-open
    _comment: 'Auth: /auth/v1/verify* -> http://auth:9999/verify*'
    url: http://auth:9999/verify
    routes:
      - name: auth-v1-open
        strip_path: true
        paths:
          - /auth/v1/verify
    plugins:
      - name: cors
  - name: auth-v1-open-callback
    _comment: 'Auth: /auth/v1/callback* -> http://auth:9999/callback*'
    url: http://auth:9999/callback
    routes:
      - name: auth-v1-open-callback
        strip_path: true
        paths:
          - /auth/v1/callback
    plugins:
      - name: cors
  - name: auth-v1-open-authorize
    _comment: 'Auth: /auth/v1/authorize* -> http://auth:9999/authorize*'
    url: http://auth:9999/authorize
    routes:
      - name: auth-v1-open-authorize
        strip_path: true
        paths:
          - /auth/v1/authorize
    plugins:
      - name: cors
  - name: auth-v1-open-jwks
    _comment: 'Auth: /auth/v1/.well-known/jwks.json -> http://auth:9999/.well-known/jwks.json'
    url: http://auth:9999/.well-known/jwks.json
    routes:
      - name: auth-v1-open-jwks
        strip_path: true
        paths:
          - /auth/v1/.well-known/jwks.json
    plugins:
      - name: cors
  - name: auth-v1-open-well-known-oauth
    _comment: 'Auth: /auth/v1/.well-known/oauth-authorization-server -> http://auth:9999/.well-known/oauth-authorization-server'
    url: http://auth:9999/.well-known/oauth-authorization-server
    routes:
      - name: auth-v1-open-well-known-oauth
        strip_path: true
        paths:
          - /auth/v1/.well-known/oauth-authorization-server
    plugins:
      - name: cors
  - name: auth-v1-open-well-known-openid
    _comment: 'Auth: /auth/v1/.well-known/openid-configuration -> http://auth:9999/.well-known/openid-configuration'
    url: http://auth:9999/.well-known/openid-configuration
    routes:
      - name: auth-v1-open-well-known-openid
        strip_path: true
        paths:
          - /auth/v1/.well-known/openid-configuration
    plugins:
      - name: cors

  - name: auth-v1-open-sso-acs
    url: "http://auth:9999/sso/saml/acs"
    routes:
      - name: auth-v1-open-sso-acs
        strip_path: true
        paths:
        - /auth/v1/sso/saml/acs
    plugins:
      - name: cors

  - name: auth-v1-open-sso-metadata
    url: "http://auth:9999/sso/saml/metadata"
    routes:
      - name: auth-v1-open-sso-metadata
        strip_path: true
        paths:
        - /auth/v1/sso/saml/metadata
    plugins:
      - name: cors

  ## OAuth 2.1 server endpoints that third-party clients call without an
  ## API key. The consent endpoints (/oauth/authorizations/...) stay on the
  ## secure auth-v1 route.
  - name: auth-v1-open-oauth
    _comment: 'Auth: /auth/v1/oauth/{authorize,clients/register,token,userinfo} -> http://auth:9999/oauth/*'
    url: http://auth:9999/
    routes:
      - name: auth-v1-open-oauth
        strip_path: false
        paths:
          - /auth/v1/oauth/(?<endpoint>authorize|clients/register|token|userinfo)$
    plugins:
      - name: cors
      - name: request-transformer
        config:
          replace:
            uri: /oauth/$(uri_captures.endpoint)

  ## Secure Auth routes
  - name: auth-v1
    _comment: 'Auth: /auth/v1/* -> http://auth:9999/*'
    url: http://auth:9999/
    routes:
      - name: auth-v1-all
        strip_path: true
        paths:
          - /auth/v1/
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: false
      - name: request-transformer
        config:
          add:
            headers:
              - "Authorization: $LUA_AUTH_EXPR"
          replace:
            headers:
              - "Authorization: $LUA_AUTH_EXPR"
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon

  ## OpenAPI root - admin only
  - name: rest-v1-openapi
    _comment: 'PostgREST OpenAPI root: /rest/v1/ -> <http://rest:3000/> (admin only). See <https://github.com/orgs/supabase/discussions/42949>'
    url: http://rest:3000/
    routes:
      - name: rest-v1-openapi-root
        strip_path: true
        expression: 'http.path == "/rest/v1/"'
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: false
      - name: request-transformer
        config:
          add:
            headers:
              - "Authorization: $LUA_AUTH_EXPR"
          replace:
            headers:
              - "Authorization: $LUA_AUTH_EXPR"
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin

  ## Secure PostgREST routes
  - name: rest-v1
    _comment: 'PostgREST: /rest/v1/* -> http://rest:3000/*'
    url: http://rest:3000/
    routes:
      - name: rest-v1-all
        strip_path: true
        paths:
          - /rest/v1/
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: false
      - name: request-transformer
        config:
          add:
            headers:
              - "Authorization: $LUA_AUTH_EXPR"
          replace:
            headers:
              - "Authorization: $LUA_AUTH_EXPR"
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon
      # Sandboxes responses, since Studio shares this origin: a document opened
      # from these routes can't run script or submit forms. Subresources (<img>,
      # fetch, downloads) ignore the policy. media-src 'self' lets the browser's player
      # load audio and video opened directly, and style-src 'unsafe-inline' keeps
      # inline styles in SVG files. `&sandbox_response` is a YAML anchor:
      # the storage-v1 and functions-v1 services below reuse this same Lua code
      # through the `*sandbox_response` alias, which YAML expands into a copy.
      - name: post-function
        config:
          header_filter:
            - &sandbox_response |
              kong.response.set_header(
                "Content-Security-Policy",
                "default-src 'none'; media-src 'self'; style-src 'unsafe-inline'; sandbox"
              )


  ## Edge Functions routes
  ##
  ## Functions header handling: opaque sb_ keys are translated to the pre-signed
  ## internal asymmetric JWT and injected as a raw `sb-api-key` header (no
  ## `Bearer` prefix), while `Authorization` is left untouched so user-session
  ## JWTs and legacy bearers flow through to the runtime.
  ##
  ## No `key-auth`: Functions is a passthrough that does NOT validate keys. Kong
  ## cannot reject an invalid key while still letting unauthenticated requests
  ## through (key-auth's `anonymous` fallback accepts missing AND invalid keys
  ## alike), so unknown/invalid keys simply pass to the runtime, which handles
  ## verify_jwt itself.
  ##
  ## The request-transformer strips any client-supplied `sb-api-key` (anti-spoof)
  ## and re-adds the translated value; on no match the Lua expression yields nil
  ## (an empty header) which the post-function then removes.
  ##
  ## No `cors`: functions handle CORS themselves, as on the platform. Preflights
  ## reach the function and its responses pass through unchanged.
  - name: functions-v1
    _comment: 'Edge Functions: /functions/v1/* -> http://functions:9000/*'
    url: http://functions:9000/
    # Limit inactivity between reads, leaving 10s for the runtime's 150s idle timeout.
    read_timeout: 160000
    routes:
      - name: functions-v1-all
        strip_path: true
        paths:
          - /functions/v1/
    plugins:
      - name: request-transformer
        config:
          remove:
            headers:
              - "sb-api-key"
          add:
            headers:
              - "sb-api-key:$LUA_FUNCTIONS_EXPR"
      - name: post-function
        config:
          access:
            - |
              local v = kong.request.get_header("sb-api-key")
              if v == nil or v == "" or v:find("^%s*$") then
                kong.service.request.clear_header("sb-api-key")
              end
          header_filter:
            # Same Lua code as the rest-v1 service (YAML alias of `&sandbox_response`)
            - *sandbox_response

  ## OAuth 2.0 Authorization Server Metadata (RFC 8414)
  - name: well-known-oauth
    _comment: 'Auth: /.well-known/oauth-authorization-server/auth/v1 -> http://auth:9999/.well-known/oauth-authorization-server'
    url: http://auth:9999/.well-known/oauth-authorization-server
    routes:
      - name: well-known-oauth
        strip_path: true
        paths:
          - /.well-known/oauth-authorization-server/auth/v1
    plugins:
      - name: cors

