# Auth email templates (local Supabase). Prod: paste same HTML in Dashboard → Email Templates.
# See docs/AUTH_EMAILS.md
[auth]
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173", "http://localhost:5173"]

[auth.email]
enable_signup = true

[auth.email.template.recovery]
subject = "Сброс пароля — StaySee AI"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.confirmation]
subject = "Добро пожаловать в StaySee AI"
content_path = "./supabase/templates/confirmation.html"

[functions.weekly-reflection]
verify_jwt = true

[functions.backfill-conversation-summaries]
verify_jwt = false

[functions.purge-scheduled-rooms]
verify_jwt = false

[functions.memory-health-check]
verify_jwt = false

# No bearer JWT on Auth hooks: auth-email verifies Standard Webhooks signatures before any reads or sends.
[functions.auth-email]
verify_jwt = false

# The admin panel (docs/superpowers/specs/2026-11-20-admin-panel-design.md): the gateway checks the login token; admin-api checks the admin flag and a fresh password itself.
[functions.admin-api]
verify_jwt = true

# Payments (test mode only for now; sales are off). create/status need the person's login token. The cashier's result calls have no login token:
# they check the signature, the mode, the shop and the amount themselves. robokassa-live-result is NOT deployed until the owner approves sales.
[functions.robokassa-test-create]
verify_jwt = true

[functions.robokassa-test-status]
verify_jwt = true

[functions.robokassa-test-result]
verify_jwt = false

[functions.robokassa-live-result]
verify_jwt = false
